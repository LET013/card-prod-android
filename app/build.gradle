plugins {
    id 'com.android.application'
//    id 'kotlin-android'
}



android {
    namespace 'com.xingyao.card'
    compileSdk 34
    ndkVersion "22.1.7171670"

    defaultConfig {
        applicationId "com.xingyao.card"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    dataBinding{
        enabled = true
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
//    kotlinOptions {
//        jvmTarget = '1.8'
//    }
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../uniapp/dist/build/h5']
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.6.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // 串口通信使用 JNI SerialPort（见 cpp/SerialPort.c），不再依赖 xmaihh serialport
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    // FaceAISDK - Open Source Face Recognition (replaces ArcSoft)
    // Hosted on Maven Central; if IDE prompts about missing sources, click Skip
    implementation 'io.github.faceaisdk:Android:2026.06.25'

    // CameraX 1.4.2 - matches FaceAISDK POM transitive dependency version
    def camerax_version = "1.4.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
