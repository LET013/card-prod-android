name: Apply reference device foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.reference-migration/**'
      - '.github/workflows/apply-reference-stage1.yml'

permissions:
  contents: write

jobs:
  migrate-test-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch independent reference branch
        run: git fetch origin reference/motone-current:refs/remotes/origin/reference/motone-current

      - name: Apply stage 1 migration
        run: |
          python3 .reference-migration/apply_stage1.py
          python3 .reference-migration/post_stage1.py

      - name: Validate source boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/xingyao/card/core/FaceAiManager.java
          test -f app/src/main/java/com/xingyao/card/FaceEnrollmentController.java
          test -f app/src/main/java/com/xingyao/card/serial/SerialManager.java
          test -f app/src/main/cpp/SerialPort.c
          ! test -e app/src/main/java/com/xingyao/card/core/ArcFaceManager.java
          ! test -e app/src/main/java/com/xingyao/card/core/ArcFaceTemplateCleaner.java
          ! test -e app/libs/arcsoft_face.jar
          ! grep -R 'com.arcsoft\|ARCSOFT_' app/src/main app/build.gradle
          ! grep -R 'xmaihh' app/src/main app/build.gradle
          grep -q 'io.github.faceaisdk:Android:2026.06.25' app/build.gradle
          grep -q 'externalNativeBuild' app/build.gradle
          grep -q 'addressMode", "UNCONFIRMED' app/src/main/java/com/xingyao/card/core/SerialConnectionManager.java
          ! grep -q 'boardAddressLabel' app/src/main/java/com/xingyao/card/core/SlotStateRepository.java
          ! grep -q 'EMP-${index}\|employee-1.jpg' uniapp/src/services/index.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build uni-app H5
        shell: bash
        run: |
          set -euo pipefail
          cd uniapp
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build:h5
          test -s dist/build/h5/index.html

      - name: Install H5 assets
        run: |
          rm -rf app/src/main/assets/*
          cp -R uniapp/dist/build/h5/. app/src/main/assets/

      - name: Run Android unit tests
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain > /tmp/tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            mkdir -p .diagnostic
            {
              echo 'REFERENCE_STAGE1_ANDROID_TEST_FAILURE'
              grep -E -i 'error:|cannot find symbol|incompatible types|method .* cannot be applied|FAILURE:|FAILED|Execution failed|There were failing tests|CMake Error|ninja:' /tmp/tests.log | tail -n 160 || true
              echo '--- LOG TAIL ---'
              tail -n 180 /tmp/tests.log
            } > .diagnostic/reference-stage1-error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .diagnostic/reference-stage1-error.txt
            git commit -m '记录参考源码迁移编译诊断 [skip ci]'
            git push origin HEAD:"${HEAD_BRANCH}"
            exit "$status"
          fi
          tail -n 40 /tmp/tests.log

      - name: Build debug APK including JNI and H5
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --console=plain > /tmp/build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '===== APK BUILD FAILURE ====='
            grep -E -i 'error:|cannot find symbol|incompatible types|FAILURE:|FAILED|Execution failed|ninja:|CMake Error' /tmp/build.log | tail -n 160 || true
            tail -n 200 /tmp/build.log
            exit "$status"
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libSerialPort.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
          tail -n 40 /tmp/build.log

      - name: Commit verified migration
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app uniapp/src/services/index.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m '迁入FaceAISDK与JNI串口设备基础'
          git push origin HEAD:"${HEAD_BRANCH}"
