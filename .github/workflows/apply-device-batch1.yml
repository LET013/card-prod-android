name: Apply device integration batch 1

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/device-integration-architecture
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Reconstruct audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .batch1/chunk-* > /tmp/device-batch1.patch.gz.b64
          echo "07526f7377fde52f65c8868d2f694a662f424c80e8650a8ba52568489a683967  /tmp/device-batch1.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/device-batch1.patch.gz.b64 > /tmp/device-batch1.patch.gz
          echo "0c1d05b1644fb75d2fbfedfae3f790a13b6dd2f08a1f91795d80131452d6f83f  /tmp/device-batch1.patch.gz" | sha256sum -c -
          gzip -dc /tmp/device-batch1.patch.gz > /tmp/device-batch1.patch
          echo "0fe70e3bf255355bdee873592dae627c325d6c2f31f06e30516dedbae4fae4e9  /tmp/device-batch1.patch" | sha256sum -c -
          git apply --check /tmp/device-batch1.patch
          git apply /tmp/device-batch1.patch

      - name: Apply reviewed compile fixups
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/xingyao/card/core/DeviceDataSyncManager.java')
          text = path.read_text(encoding='utf-8')
          old = '.put("message", "人脸同步数据缺少 employeeId、faceFeature 或 faceImage");'
          new = '.put("message", "人脸同步数据缺少 employeeId、faceFeature 或 faceImage"));'
          if old not in text:
              raise SystemExit('Expected DeviceDataSyncManager compile-fix target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Restore complete Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x gradlew
          if ! grep -qxF '!gradle/wrapper/gradle-wrapper.jar' .gitignore; then
            printf '\n# Keep the reproducible Gradle Wrapper binary\n!gradle/wrapper/gradle-wrapper.jar\n' >> .gitignore
          fi
          test -s gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version

      - name: Validate frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check uniapp/src/services/nativeBridge.js
          node --check uniapp/src/services/index.js
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'uniapp/src/pages/serial-demo/serial-demo.vue',
              'uniapp/src/pages/splash/splash.vue',
          ]:
              value = Path(name).read_text()
              assert value.count('<template>') == value.count('</template>'), name
              assert value.count('<script setup>') == value.count('</script>'), name
              assert value.count('<style') == value.count('</style>'), name
          PY

      - name: Run Android unit tests
        shell: bash
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain > /tmp/gradle-test.log 2>&1
          status=$?
          tail -n 220 /tmp/gradle-test.log
          exit $status

      - name: Upload Android test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-failure-${{ github.run_id }}
          path: /tmp/gradle-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Commit complete validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          git commit -m "建立设备端安全边界与命令幂等骨架"
          git push origin HEAD:fix/device-integration-architecture
