name: Device integration CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'uniapp/**'
      - 'docs/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/device-integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Codex guidance and skills
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          required = [Path('AGENTS.md'), Path('docs/CODEX_PROJECT_GUIDE.md')]
          for path in required:
              assert path.is_file() and path.stat().st_size > 0, f'missing required guidance: {path}'

          skill_files = sorted(Path('.agents/skills').glob('*/SKILL.md'))
          assert skill_files, 'no repository skills found'
          names = set()
          for path in skill_files:
              lines = path.read_text(encoding='utf-8').splitlines()
              assert lines and lines[0].strip() == '---', f'missing frontmatter start: {path}'
              try:
                  end = lines[1:].index('---') + 1
              except ValueError as exc:
                  raise AssertionError(f'missing frontmatter end: {path}') from exc
              metadata = {}
              for line in lines[1:end]:
                  if ':' not in line:
                      continue
                  key, value = line.split(':', 1)
                  metadata[key.strip()] = value.strip()
              name = metadata.get('name', '')
              description = metadata.get('description', '')
              assert name, f'missing name: {path}'
              assert description, f'missing description: {path}'
              assert name == path.parent.name, f'name/directory mismatch: {path}'
              assert name not in names, f'duplicate skill name: {name}'
              assert len(description) <= 600, f'description too long: {path}'
              names.add(name)

          expected = {
              'card-cabinet-architecture-guardian',
              'android-device-integration',
              'workcard-serial-v15',
              'backend-contract-mqtt-http',
              'device-operation-state-machine',
              'diagnostics-outbox',
              'device-release-gate',
          }
          assert expected.issubset(names), f'missing expected skills: {sorted(expected - names)}'
          print(f'validated {len(skill_files)} repository skills')
          PY

      - name: Validate three-layer boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          facade_path = Path('app/src/main/java/com/xingyao/card/core/DeviceApplicationFacade.java')
          bridge_path = Path('app/src/main/java/com/xingyao/card/JsBridge.java')
          state_path = Path('uniapp/src/state/appState.js')
          services_path = Path('uniapp/src/services/index.js')

          for path in [facade_path, bridge_path, state_path, services_path]:
              assert path.is_file() and path.stat().st_size > 0, f'missing architecture file: {path}'

          bridge = bridge_path.read_text(encoding='utf-8')
          assert 'DeviceApplicationFacade' in bridge, 'JsBridge must delegate through DeviceApplicationFacade'
          for forbidden in ['DeviceCoreService', 'NativeSettingsRepository', 'NativeAuthManager', 'SerialConnectionManager', 'WebSocketConnectionManager']:
              assert forbidden not in bridge, f'JsBridge bypasses facade via {forbidden}'

          state = state_path.read_text(encoding='utf-8')
          for forbidden in ['uni.getStorageSync', 'uni.setStorageSync', 'card.runtime.v2', 'card.slots.v2', 'card.employees.v2']:
              assert forbidden not in state, f'Vue business projection must not persist: {forbidden}'

          services = services_path.read_text(encoding='utf-8')
          for forbidden in [
              'appState.employees.unshift',
              'appState.employees = appState.employees.filter',
              'persistEmployees',
              'persistSlots',
              'persistRuntime',
              'rebuildSlots()',
          ]:
              assert forbidden not in services, f'Vue service mutates or persists Android-owned data: {forbidden}'
          assert 'replaceEmployeesProjection' in services
          assert 'replaceSlotsProjection' in services

          privileged = []
          for path in Path('uniapp/src').rglob('*'):
              if path.suffix not in {'.js', '.vue'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'window.android.postMessage' in text:
                  privileged.append(path.as_posix())
          assert privileged == ['uniapp/src/services/nativeBridge.js'], f'direct native bridge access outside adapter: {privileged}'
          print('validated UI -> facade -> repository/communication boundaries')
          PY

      - name: Validate frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check uniapp/src/services/nativeBridge.js
          node --check uniapp/src/services/index.js
          node --check uniapp/src/state/appState.js
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'uniapp/src/pages/serial-demo/serial-demo.vue',
              'uniapp/src/pages/splash/splash.vue',
          ]:
              value = Path(name).read_text(encoding='utf-8')
              assert value.count('<template>') == value.count('</template>'), name
              assert value.count('<script setup>') == value.count('</script>'), name
              assert value.count('<style') == value.count('</style>'), name
          PY

      - name: Run Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
