name: Device integration CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'uniapp/**'
      - 'docs/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/device-integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate guidance and skills
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          required = [
              Path('AGENTS.md'),
              Path('docs/CODEX_PROJECT_GUIDE.md'),
              Path('docs/COMPLETE_THREE_LAYER_ARCHITECTURE.md'),
              Path('docs/CONTRACT_EVIDENCE_REGISTER.md'),
              Path('docs/DEVICE_CONFIGURATION_AND_INTERFACE_AUDIT.md'),
              Path('docs/source-2026-07-02/Android客户端接口文档.md'),
              Path('docs/source-2026-07-02/智能工卡发卡机APP通信协议文档.md'),
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size > 0, f'missing required guidance: {path}'

          skill_files = sorted(Path('.agents/skills').glob('*/SKILL.md'))
          assert skill_files, 'no repository skills found'
          names = set()
          for path in skill_files:
              lines = path.read_text(encoding='utf-8').splitlines()
              assert lines and lines[0].strip() == '---', f'missing frontmatter: {path}'
              end = lines[1:].index('---') + 1
              metadata = {}
              for line in lines[1:end]:
                  if ':' in line:
                      key, value = line.split(':', 1)
                      metadata[key.strip()] = value.strip()
              name = metadata.get('name', '')
              description = metadata.get('description', '')
              assert name == path.parent.name and description, f'invalid skill metadata: {path}'
              assert name not in names, f'duplicate skill: {name}'
              names.add(name)

          expected = {
              'card-cabinet-architecture-guardian',
              'android-device-integration',
              'workcard-serial-v15',
              'backend-contract-mqtt-http',
              'device-operation-state-machine',
              'diagnostics-outbox',
              'device-release-gate',
          }
          assert expected.issubset(names), f'missing skills: {sorted(expected - names)}'
          print(f'validated {len(skill_files)} skills and source documents')
          PY

      - name: Validate strict three-layer architecture and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/src/main/java/com/xingyao/card')
          paths = {
              'bridge': root / 'JsBridge.java',
              'activity': root / 'MainActivity.java',
              'face_controller': root / 'FaceEnrollmentController.java',
              'facade': root / 'core/DeviceApplicationFacade.java',
              'registry': root / 'core/DeviceRuntimeRegistry.java',
              'data_layer': root / 'core/DeviceDataLayer.java',
              'state_store': root / 'core/DeviceStateStore.java',
              'repository': root / 'core/DeviceDataRepository.java',
              'slot_repository': root / 'core/SlotStateRepository.java',
              'coordinator': root / 'core/DeviceCommandCoordinator.java',
              'provisioning': root / 'core/DeviceProvisioningManager.java',
              'documented_service': root / 'core/DocumentedBackendService.java',
              'sync': root / 'core/DeviceDataSyncManager.java',
              'transport': root / 'core/BackendTransportManager.java',
              'http_gateway': root / 'core/BackendHttpGateway.java',
              'http_client': root / 'core/BackendHttpClient.java',
              'serial': root / 'core/SerialConnectionManager.java',
              'serial_manager': root / 'serial/SerialManager.java',
              'serial_port': root / 'serial/SerialPort.java',
              'face': root / 'core/FaceAiManager.java',
              'service': root / 'service/DeviceCoreService.java',
              'ui_state': Path('uniapp/src/state/appState.js'),
              'ui_services': Path('uniapp/src/services/index.js'),
              'native_bridge': Path('uniapp/src/services/nativeBridge.js'),
          }
          for name, path in paths.items():
              assert path.is_file() and path.stat().st_size > 0, f'missing {name}: {path}'

          def text(name):
              return paths[name].read_text(encoding='utf-8')

          bridge = text('bridge')
          assert 'DeviceApplicationFacade' in bridge and 'facade.execute' in bridge
          for forbidden in ['DeviceCoreService', 'DeviceDataLayer', 'DeviceStateStore',
                            'BackendTransportManager', 'BackendHttpGateway',
                            'SerialConnectionManager', 'DeviceDataRepository']:
              assert forbidden not in bridge, f'JsBridge bypasses facade via {forbidden}'

          facade = text('facade')
          assert 'DeviceRuntimeRegistry' in facade
          for forbidden in ['DeviceCoreService', 'BackendTransportManager', 'BackendHttpGateway',
                            'SerialConnectionManager', 'FaceAiManager', 'DeviceDataRepository']:
              assert forbidden not in facade, f'Facade bypasses data layer via {forbidden}'

          activity = text('activity')
          assert not re.findall(r'DeviceCoreService\.(?!class\b)', activity), \
              'Activity calls static Service business API'
          assert 'DeviceRuntimeRegistry.setUiListener' in activity
          assert 'FaceEnrollmentController' in activity
          assert 'CameraXConfig' in activity or 'ProcessCameraProvider' in activity
          assert 'jsBridge.close()' in activity

          face_controller = text('face_controller')
          assert 'DeviceRuntimeRegistry.require()' in face_controller
          assert 'FaceSearchEngine' in face_controller
          assert 'DeviceCoreService' not in face_controller

          service = text('service')
          for forbidden in ['handleSocketCommand', 'handleRemoteOpen', 'sendCardEvent',
                            'reportRuntimeEvent', 'public static JSONObject',
                            'public static JSONArray', 'setDeviceEventListener']:
              assert forbidden not in service, f'Service contains business logic: {forbidden}'
          for required in ['new DeviceDataLayer', 'DeviceRuntimeRegistry.install',
                           'new SerialConnectionManager', 'new BackendTransportManager',
                           'new DeviceProvisioningManager', 'new DocumentedBackendService']:
              assert required in service, f'Service missing wiring: {required}'

          data_layer = text('data_layer')
          for required in ['DeviceStateStore', 'DeviceProvisioningManager',
                           'DocumentedBackendService', 'provisionAndStartBackend',
                           'completeFaceEnrollment', 'completeFaceVerification',
                           'upsertEmployee', 'uploadFaceImage', 'downloadFirmware']:
              assert required in data_layer, f'Data layer missing {required}'

          store = text('state_store')
          assert 'LinkedHashMap<String, JSONObject> sections' in store
          assert 'LinkedHashMap<String, JSONObject> operations' in store
          assert 'state("PENDING", "等待后端授权状态")' in store

          repository = text('repository')
          for required in ['LinkedHashMap<String, JSONObject> employees',
                           'LinkedHashMap<String, JSONObject> faceFeatures',
                           'LinkedHashMap<String, JSONObject> fingerFeatures']:
              assert required in repository
          assert 'upsertMap(employees, items, "employeeId")' in repository
          assert 'applyFeatureDelta(faceFeatures, items, "faceId")' in repository
          assert 'applyFeatureDelta(fingerFeatures, items, "fingerId")' in repository

          # Communication adapters receive configuration and return results only.
          for name in ['transport', 'http_gateway', 'serial', 'face']:
              adapter = text(name)
              for forbidden in ['MainActivity', 'JsBridge', 'DeviceApplicationFacade',
                                'DeviceStateStore', 'DeviceDataLayer', 'SlotStateRepository',
                                'DeviceDataRepository', 'NativeSettingsRepository',
                                'DeviceCommandCoordinator', 'DeviceProvisioningManager']:
                  assert forbidden not in adapter, f'{name} adapter depends on {forbidden}'

          provisioning = text('provisioning')
          assert 'NativeSettingsRepository' in provisioning
          assert 'BackendHttpGateway' in provisioning
          assert 'new BackendHttpClient' not in provisioning
          assert 'activationRequired' in provisioning
          assert '!"ACTIVATED".equalsIgnoreCase' in provisioning

          documented = text('documented_service')
          assert 'interface Transport' in documented
          assert 'BackendHttpGateway' in documented
          for required in ['upsertEmployee', 'upsertFaceFeature',
                           'registeredFaceEmployeeIds', 'reportTake', 'reportReturn',
                           'uploadFingerprint', 'uploadLogsBatch',
                           'uploadFaceImage', 'downloadFirmware']:
              assert required in documented, f'documented endpoint entry missing: {required}'

          sync = text('sync')
          assert 'BackendHttpGateway' in sync and 'new BackendHttpClient' not in sync
          assert 'syncAll(boolean full)' in sync
          assert 'fullSync' not in sync

          # HTTP client is constructed only by the gateway.
          constructors = []
          for path in root.rglob('*.java'):
              if 'new BackendHttpClient' in path.read_text(encoding='utf-8'):
                  constructors.append(path.as_posix())
          assert constructors == [(root / 'core/BackendHttpGateway.java').as_posix()], \
              f'HTTP client bypass: {constructors}'

          # User-confirmed FaceAISDK and JNI serial only.
          build = Path('app/build.gradle').read_text(encoding='utf-8')
          assert 'io.github.faceaisdk:Android:2026.06.25' in build
          assert 'externalNativeBuild' in build
          forbidden_face = ['com.arcsoft', 'arcsoft_face.jar', 'ARCSOFT_', 'xmaihh']
          source_text = '\n'.join(path.read_text(encoding='utf-8', errors='ignore')
                                  for path in Path('app/src/main').rglob('*') if path.is_file())
          for forbidden in forbidden_face:
              assert forbidden not in build and forbidden not in source_text, \
                  f'abandoned dependency returned: {forbidden}'
          assert 'FaceAISDKEngine' in text('face')
          assert 'closeNative' in text('serial_port')
          assert 'public void send(byte[] data) throws IOException' in text('serial_manager')
          c_source = Path('app/src/main/cpp/SerialPort.c').read_text(encoding='utf-8')
          assert 'Java_com_xingyao_card_serial_SerialPort_closeNative' in c_source

          # No undocumented slot topology or invented business display data.
          serial = text('serial')
          assert 'addressMode", "UNCONFIRMED' in serial
          assert 'SERIAL_TOPOLOGY_UNCONFIRMED' in serial
          assert 'return slotNumber;' not in serial
          assert 'return ((slotNumber - 1) %' not in serial
          slot_repository = text('slot_repository')
          assert 'boardAddressLabel' not in slot_repository
          assert '.put("boardAddress"' not in slot_repository

          # Exact V4.1 downlink set and response correlation.
          coordinator = text('coordinator')
          expected_commands = {
              'remoteOpen', 'remoteEjectAll', 'restartApp', 'syncUser', 'syncConfig',
              'firmwareUpgrade', 'cancelUpgrade', 'deviceSelfCheck',
              'enableLogUpload', 'disableLogUpload',
          }
          actual_commands = set(re.findall(r'case "([^"]+)"', coordinator))
          assert actual_commands == expected_commands, sorted(actual_commands)
          assert '.put("msgId", command == null ? "" : command.optString("msgId", ""))' in coordinator
          codes = {int(value) for value in re.findall(r'\.put\("code",\s*(\d+)\)', coordinator)}
          assert codes.issubset({0, 500}), f'undocumented terminal codes: {codes}'
          for forbidden in ['case "queryStatus"', 'case "syncEmployeeData"',
                            'case "syncFaceData"', 'case "syncFingerData"',
                            'physicalConfirmed', '.put("recovered"']:
              assert forbidden not in coordinator, f'undocumented wire behavior: {forbidden}'

          transport = text('transport')
          assert 'listener.onRuntimeToken(runtimeToken)' in transport
          assert 'addUnique(candidates, deviceCode)' not in transport
          assert 'addUnique(candidates, clientId)' not in transport
          assert '.put("ip", "127.0.0.1")' not in transport

          # Documented endpoint constants and facade actions.
          gateway = text('http_gateway')
          for endpoint in ['EMPLOYEE_UPSERT', 'EMPLOYEE_FACE_UPSERT', 'FACE_REGISTERED',
                           'CARD_TAKE', 'CARD_RETURN', 'FACE_UPLOAD',
                           'FINGERPRINT_UPLOAD', 'LOGS_BATCH']:
              assert endpoint in gateway, f'missing endpoint constant {endpoint}'
          for action in ['employee.upsert', 'employee.face.upsert',
                         'employee.face.registered', 'face.uploadImage',
                         'fingerprint.uploadFeature', 'logs.uploadBatch',
                         'firmware.download']:
              assert action in facade, f'missing facade action {action}'

          # No hidden server, guessed scheme, or runtime token Bearer.
          http_client = text('http_client')
          assert 'HTTP基础地址不能为空' in http_client
          assert 'card-test.quyohui.com' not in http_client
          assert 'raw = "http://' not in http_client
          for path in [Path('app/src/main'), Path('uniapp/src')]:
              combined = '\n'.join(p.read_text(encoding='utf-8', errors='ignore')
                                   for p in path.rglob('*') if p.is_file())
              assert 'card-test.quyohui.com' not in combined
              assert '119.146.88.108' not in combined
          assert 'runtimeToken' not in gateway

          # Vue remains a projection and does not invent employee business data.
          ui_state = text('ui_state')
          for forbidden in ['uni.getStorageSync', 'uni.setStorageSync', 'uni.removeStorageSync',
                            'persistSettings', 'persistSlots', 'persistEmployees',
                            'persistRuntime', 'persistSession',
                            'card.runtime.v2', 'card.slots.v2', 'card.employees.v2']:
              assert forbidden not in ui_state, f'Vue persists business state: {forbidden}'
          assert 'slots: []' in ui_state and 'employees: []' in ui_state

          ui_services = text('ui_services')
          for forbidden in ['EMP-${index}', 'employee-1.jpg',
                            'appState.settings.deviceId || appState.settings.deviceCode',
                            'appState.employees.unshift',
                            'appState.employees = appState.employees.filter']:
              assert forbidden not in ui_services, f'Vue invents/mutates business data: {forbidden}'

          direct_bridge = []
          for path in Path('uniapp/src').rglob('*'):
              if path.suffix in {'.js', '.vue'} and \
                      'window.android.postMessage' in path.read_text(encoding='utf-8'):
                  direct_bridge.append(path.as_posix())
          assert direct_bridge == ['uniapp/src/services/nativeBridge.js'], direct_bridge

          # No migration or diagnostics in delivery branch.
          temporary = [
              '.refactor', '.batch1', '.contract-rollback', '.reference-migration',
              '.stage2-migration', '.finalize-migration', '.diagnostic',
              '.github/workflows/apply-complete-three-layer.yml',
              '.github/workflows/apply-contract-evidence-rollback.yml',
              '.github/workflows/apply-reference-stage1.yml',
              '.github/workflows/apply-stage2.yml',
              '.github/workflows/apply-finalize.yml',
          ]
          for value in temporary:
              assert not Path(value).exists(), f'temporary artifact remains: {value}'

          print('validated strict three layers, FaceAISDK/JNI and V4.1 interface boundaries')
          PY

      - name: Validate frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check uniapp/src/services/nativeBridge.js
          node --check uniapp/src/services/index.js
          node --check uniapp/src/services/mockService.js
          node --check uniapp/src/state/appState.js

      - name: Build uni-app H5
        shell: bash
        run: |
          set -euo pipefail
          cd uniapp
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build:h5
          test -s dist/build/h5/index.html

      - name: Install generated H5 assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/*
          cp -R uniapp/dist/build/h5/. app/src/main/assets/
          test -s app/src/main/assets/index.html

      - name: Run Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build debug APK with FaceAISDK JNI and H5
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libSerialPort.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
