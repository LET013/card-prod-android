name: Apply complete three-layer refactor

on:
  push:
    branches:
      - fix/device-integration-architecture
    paths:
      - '.refactor/apply_remaining_three_layer.py'
      - '.github/workflows/apply-complete-three-layer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/device-integration-architecture
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Activity migration
        run: python3 .refactor/apply_remaining_three_layer.py
      - name: Validate frontend
        run: |
          set -euo pipefail
          node --check uniapp/src/services/nativeBridge.js
          node --check uniapp/src/services/index.js
          node --check uniapp/src/services/mockService.js
          node --check uniapp/src/state/appState.js
          cd uniapp
          npm install --legacy-peer-deps
          npm run build:h5
      - name: Install H5 assets
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/*
          cp -R uniapp/dist/build/h5/. app/src/main/assets/
      - name: Run Android unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Commit validated migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完成 UI、Android 数据层与通信层彻底分离"
          git push origin HEAD:fix/device-integration-architecture
