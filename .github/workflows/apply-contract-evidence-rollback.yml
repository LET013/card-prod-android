name: Apply contract evidence rollback

on:
  pull_request:
    branches:
      - main
    paths:
      - '.contract-rollback/**'
      - '.github/workflows/apply-contract-evidence-rollback.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair one-time migration script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.contract-rollback/apply.py')
          s = p.read_text(encoding='utf-8')

          bad = '''# Remove undocumented queryStatus handler.
          replace_block(path,
          \'\'\'    private void handleQueryStatus(JSONObject command) throws Exception {\'\'\',
          \'\'\'    private void handleSync(JSONObject command, String scope) throws JSONException {\'\'\',
          \'\'\'    private void handleSync(JSONObject command, String scope) throws JSONException {\'\'\')
          # The preceding replacement intentionally preserves the sync method signature once.
          '''
          good = '''# Remove undocumented queryStatus handler.
          replace_block(path,
          \'\'\'    private void handleQueryStatus(JSONObject command) throws Exception {\'\'\',
          \'\'\'    private void handleSync(JSONObject command, String scope) throws JSONException {\'\'\',
          '')
          '''
          assert bad in s
          s = s.replace(bad, good, 1)

          start = s.index("replace_once(path,\n'''      faceRecognitionThreshold: Number(form.faceRecognitionThreshold),")
          end = s.index("# Remove unused UiSwitch import", start)
          fixed = '''replace_once(path,
          """      faceRecognitionThreshold: Number(form.faceRecognitionThreshold),
                cardParseMode: String(form.cardNumberMode).toUpperCase() === 'PHYSICAL' ? '物理卡号' : '可视卡号'""",
          """      faceRecognitionThreshold: Number(form.faceRecognitionThreshold),
                serialPollingEnabled: false,
                cardNumberMode: 'VISIBLE',
                cardParseMode: '转可见符'""")
          '''
          s = s[:start] + fixed + s[end:]

          marker = "path = 'app/src/main/java/com/xingyao/card/core/DeviceDataSyncManager.java'\n# No undocumented"
          assert marker in s
          s = s.replace(marker,
              "path = 'app/src/main/java/com/xingyao/card/core/DeviceDataSyncManager.java'\n"
              "replace_once(path, '        JSONObject deviceScope = deviceScope(settings);\\n', '')\n"
              "# No undocumented", 1)

          marker = "path = 'app/src/main/java/com/xingyao/card/core/DeviceProvisioningManager.java'\n"
          assert marker in s
          s = s.replace(marker, marker +
              "replace_once(path, '    private static final long CREDENTIAL_REFRESH_SKEW_MS = 5L * 60L * 1000L;\\n', '')\n", 1)

          s = s.replace(
              "assert 'runtimeToken\", \"\"' not in gateway, 'runtimeToken used as HTTP Bearer'",
              "assert 'String token = settings.optString(\"runtimeToken\"' not in gateway, 'runtimeToken used as HTTP Bearer'",
              1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply evidence-only rollback
        run: python3 .contract-rollback/apply.py

      - name: Static evidence checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R 'card-test.quyohui.com\|119.146.88.108' app/src/main/java/com/xingyao/card/core/NativeSettingsRepository.java
          ! grep -R 'case "queryStatus"\|case "syncEmployeeData"\|case "syncFaceData"\|case "syncFingerData"' app/src/main/java/com/xingyao/card/core/DeviceCommandCoordinator.java
          ! grep -R 'physicalConfirmed\|\.put("recovered"' app/src/main/java/com/xingyao/card/core/DeviceCommandCoordinator.java
          ! grep -R 'return slotNumber;' app/src/main/java/com/xingyao/card/core/SerialConnectionManager.java
          grep -q 'addressMode", "UNCONFIRMED' app/src/main/java/com/xingyao/card/core/SerialConnectionManager.java
          grep -q 'CONTRACT_EVIDENCE_REGISTER' AGENTS.md

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build H5
        shell: bash
        run: |
          set -euo pipefail
          cd uniapp
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build:h5
          test -s dist/build/h5/index.html

      - name: Install H5 assets
        shell: bash
        run: |
          rm -rf app/src/main/assets/*
          cp -R uniapp/dist/build/h5/. app/src/main/assets/

      - name: Run Android tests
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain > /tmp/android-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '===== ANDROID_TEST_FAILURE ====='
            grep -E -i '(^|[[:space:]])error:|cannot find symbol|incompatible types|method .* cannot be applied|FAILURE:|FAILED|There were failing tests|Compilation failed|Execution failed for task|Exception is:' /tmp/android-tests.log | tail -n 80 || true
            echo '===== END_FAILURE ====='
            exit "$status"
          fi
          echo 'ANDROID_TESTS_PASSED'

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --console=plain > /tmp/android-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '===== ANDROID_BUILD_FAILURE ====='
            grep -E -i '(^|[[:space:]])error:|cannot find symbol|incompatible types|method .* cannot be applied|FAILURE:|FAILED|Compilation failed|Execution failed for task|Exception is:' /tmp/android-build.log | tail -n 80 || true
            echo '===== END_FAILURE ====='
            exit "$status"
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'ANDROID_APK_PASSED'

      - name: Commit verified source rollback
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md .agents/skills/card-cabinet-architecture-guardian/SKILL.md \
            .github/workflows/device-integration-ci.yml \
            app/src/main/java/com/xingyao/card/core \
            app/src/test/java/com/xingyao/card/core \
            uniapp/src/mock/data.js uniapp/src/pages/config/config.vue \
            docs/DEVICE_CONFIGURATION_AND_INTERFACE_AUDIT.md \
            docs/CONTRACT_EVIDENCE_REGISTER.md
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m '回退未证实协议假设'
          git push origin HEAD:"${HEAD_BRANCH}"
