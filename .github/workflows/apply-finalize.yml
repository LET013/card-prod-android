name: Apply final runtime and interface fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - '.finalize-migration/**'
      - '.github/workflows/apply-finalize.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply final fixes
        run: python3 .finalize-migration/apply.py

      - name: Validate final contracts and boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'activationRequired' app/src/main/java/com/xingyao/card/core/DeviceProvisioningManager.java
          grep -q '!"ACTIVATED".equalsIgnoreCase' app/src/main/java/com/xingyao/card/core/DeviceProvisioningManager.java
          grep -q 'listener.onRuntimeToken(runtimeToken)' app/src/main/java/com/xingyao/card/core/BackendTransportManager.java
          grep -q 'command.optString("msgId", "")' app/src/main/java/com/xingyao/card/core/DeviceCommandCoordinator.java
          grep -q 'face.uploadImage' app/src/main/java/com/xingyao/card/core/DeviceApplicationFacade.java
          grep -q 'uploadFaceImage' app/src/main/java/com/xingyao/card/core/DocumentedBackendService.java
          grep -q 'authType必须为CARD、FACE或FINGERPRINT' app/src/main/java/com/xingyao/card/core/DocumentedBackendService.java
          ! grep -R 'com.arcsoft\|ARCSOFT_\|xmaihh\|WebSocketConnectionManager' app/src/main app/build.gradle
          ! grep -R 'card-test.quyohui.com\|119.146.88.108' app/src/main uniapp/src
          ! grep -R 'NativeSettingsRepository\|DeviceProvisioningManager\|DeviceDataLayer\|DeviceStateStore' app/src/main/java/com/xingyao/card/core/BackendTransportManager.java app/src/main/java/com/xingyao/card/core/BackendHttpGateway.java
          ! grep -R 'new BackendHttpClient' app/src/main/java/com/xingyao/card/core/DeviceProvisioningManager.java
          grep -q 'addressMode", "UNCONFIRMED' app/src/main/java/com/xingyao/card/core/SerialConnectionManager.java
          ! grep -q 'boardAddressLabel' app/src/main/java/com/xingyao/card/core/SlotStateRepository.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build H5
        shell: bash
        run: |
          set -euo pipefail
          cd uniapp
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build:h5
          test -s dist/build/h5/index.html

      - name: Install H5 assets
        run: |
          rm -rf app/src/main/assets/*
          cp -R uniapp/dist/build/h5/. app/src/main/assets/

      - name: Run Android unit tests
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain > /tmp/tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            mkdir -p .diagnostic
            {
              echo 'FINALIZE_ANDROID_TEST_FAILURE'
              grep -E -i 'error:|cannot find symbol|incompatible types|method .* cannot be applied|FAILURE:|FAILED|Execution failed|There were failing tests|CMake Error|ninja:' /tmp/tests.log | tail -n 180 || true
              echo '--- LOG TAIL ---'
              tail -n 220 /tmp/tests.log
            } > .diagnostic/finalize-error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .diagnostic/finalize-error.txt
            git commit -m '记录最终收口编译诊断 [skip ci]'
            git push origin HEAD:"${HEAD_BRANCH}"
            exit "$status"
          fi
          tail -n 50 /tmp/tests.log

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --console=plain > /tmp/build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '===== APK BUILD FAILURE ====='
            grep -E -i 'error:|cannot find symbol|incompatible types|FAILURE:|FAILED|Execution failed|CMake Error|ninja:' /tmp/build.log | tail -n 180 || true
            tail -n 220 /tmp/build.log
            exit "$status"
          fi
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libSerialPort.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'

      - name: Commit verified final fixes
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app uniapp/src/services/index.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m '修正激活、响应msgId与文件接口收口'
          git push origin HEAD:"${HEAD_BRANCH}"
