name: Export reference permanent CI

on:
  pull_request:
    branches:
      - reference/motone-current
    paths:
      - '.github/workflows/reference-merge-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/motone-three-layer-integration
          fetch-depth: 0

      - name: Fetch permanent CI source
        run: git fetch origin fix/device-integration-architecture:refs/remotes/origin/fix/device-integration-architecture

      - name: Prepare reference-targeted CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/permanent-ci
          git show origin/fix/device-integration-architecture:.github/workflows/device-integration-ci.yml \
            > /tmp/permanent-ci/device-integration-ci.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/permanent-ci/device-integration-ci.yml')
          text = path.read_text(encoding='utf-8')
          old = "    branches:\n      - main\n"
          new = "    branches:\n      - main\n      - reference/motone-current\n"
          if old not in text:
              raise RuntimeError('permanent CI branch trigger shape changed')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Upload permanent CI
        uses: actions/upload-artifact@v4
        with:
          name: reference-permanent-ci
          path: /tmp/permanent-ci/device-integration-ci.yml
          retention-days: 3
